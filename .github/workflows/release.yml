name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag, for example v1.0.0'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      commit: ${{ steps.version.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .github/plugin-check/package-lock.json

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate tag and plugin versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          plugin_version="$(awk -F': ' '/^[[:space:]]*\*[[:space:]]Version:/ { print $2; exit }' aculect-icon-library.php | tr -d '\r')"
          tag_version="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ || "$tag_version" != "$plugin_version" ]]; then
            echo "Stable tag does not match the plugin version: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --force --tags origin
          tagged_commit="$(git rev-list -n 1 "$RELEASE_TAG^{commit}" 2>/dev/null || true)"
          current_commit="$(git rev-parse HEAD)"
          if [[ -z "$tagged_commit" || "$tagged_commit" != "$current_commit" ]]; then
            echo "The existing stable tag must point to the checked-out commit." >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$current_commit" >> "$GITHUB_OUTPUT"

      - name: Install block parser test dependency
        run: |
          curl --fail --silent --show-error --location https://wordpress.org/wordpress-6.8.tar.gz -o /tmp/wordpress.tar.gz
          tar -xzf /tmp/wordpress.tar.gz -C /tmp
          echo "WP_CORE_DIR=/tmp/wordpress" >> "$GITHUB_ENV"

      - name: Run project checks
        run: composer check
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Test and build admin assets
        run: |
          npm run test:js
          npm run build
          git diff --exit-code -- assets/build

      - name: Build production ZIP
        run: composer package

      - name: Validate directory assets
        run: php scripts/validate-directory-assets.php

      - name: Validate production ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive="build/aculect-icon-library.${RELEASE_TAG#v}.zip"
          test -s "$archive"
          size="$(stat -c '%s' "$archive")"
          if (( size >= 10485760 )); then
            echo "WordPress.org submission ZIP is too large: $size bytes" >&2
            exit 1
          fi
          unzip -t "$archive" >/dev/null
          if unzip -Z1 "$archive" | grep -Eq '^aculect-icon-library/(vendor|tests|build|\.git|\.github|\.wordpress-org|scripts)(/|$)'; then
            echo 'Development or repository files were found in the production ZIP.' >&2
            exit 1
          fi
          mkdir -p build/plugin-check
          unzip -q "$archive" -d build/plugin-check

      # The official action installs an unpinned wp-env globally. Keep the same
      # packaged-plugin scan, but use the committed runner to make releases reproducible.
      - name: Install deterministic Plugin Check runner
        run: npm ci --prefix .github/plugin-check --ignore-scripts

      - name: Run WordPress Plugin Check
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir="$GITHUB_WORKSPACE/build/plugin-check/aculect-icon-library"
          plugin_slug="$(basename "$plugin_dir")"
          wp_env="$GITHUB_WORKSPACE/.github/plugin-check/node_modules/.bin/wp-env"
          wp_version="7.1.1"
          plugin_check_version="2.1.0"

          cat > .wp-env.json <<EOF
          { "core": "WordPress/WordPress#$wp_version", "port": 8880, "testsPort": 8881, "mappings": { "wp-content/plugins/$plugin_slug": "$plugin_dir" } }
          EOF

          "$wp_env" start --update
          "$wp_env" run cli wp plugin install plugin-check --version="$plugin_check_version" --activate
          "$wp_env" run cli wp plugin activate "$plugin_slug"
          "$wp_env" run cli wp plugin check "$plugin_slug" --format=json --exclude-files=.wp-env.json --require=./wp-content/plugins/plugin-check/cli.php

      - name: Upload verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aculect-icon-library-release
          path: build/aculect-icon-library.*.zip
          if-no-files-found: error

  publish:
    name: Publish stable release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aculect-icon-library-release
          path: artifact

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          archive="$(find artifact -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; stable release assets are immutable." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$archive" \
            --target "$RELEASE_COMMIT" \
            --generate-notes \
            --latest \
            --title "Aculect Icon Library $RELEASE_TAG"

  wordpress-org:
    name: Deploy stable plugin and directory assets
    needs: [build, publish]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out verified source and directory assets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Download verified plugin ZIP
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aculect-icon-library-release
          path: artifact

      - name: Prepare SVN package and version
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          unzip -q "artifact/aculect-icon-library.${version}.zip" -d svn-package
          test -f svn-package/aculect-icon-library/aculect-icon-library.php
          test ! -d svn-package/aculect-icon-library/.wordpress-org

      - name: Deploy plugin and top-level SVN assets
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: aculect-icon-library
          BUILD_DIR: svn-package/aculect-icon-library
          ASSETS_DIR: .wordpress-org
