name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/*'

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:js
      - run: npm run build
      - name: Verify committed build assets
        run: git diff --exit-code -- assets/build

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up package builder for minimum-PHP tests
        if: matrix.php == '7.4'
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, zip
          coverage: none
      - name: Preserve package-builder executable
        if: matrix.php == '7.4'
        shell: bash
        run: |
          set -euo pipefail
          build_php="$(readlink -f "$(command -v php)")"
          "$build_php" -r 'exit(method_exists("ZipArchive", "setMtimeName") ? 0 : 1);'
          echo "ICON_LIBRARY_BUILD_PHP=$build_php" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, zip
          coverage: none
      - name: Read plugin version
        id: version
        shell: bash
        run: |
          version="$(awk -F': ' '/^[[:space:]]*\*[[:space:]]Version:/ { print $2; exit }' aculect-icon-library.php | tr -d '\r')"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: composer install --no-interaction --prefer-dist
      - name: Install WordPress test dependencies
        run: |
          curl --fail --silent --show-error --location https://wordpress.org/wordpress-7.1.2.tar.gz -o /tmp/wordpress.tar.gz
          tar -xzf /tmp/wordpress.tar.gz -C /tmp
          echo "WP_CORE_DIR=/tmp/wordpress" >> "$GITHUB_ENV"
      - run: composer check
      - if: matrix.php == '8.4'
        run: composer package
      - if: matrix.php == '8.4'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aculect-icon-library-${{ steps.version.outputs.value }}
          path: build/aculect-icon-library.${{ steps.version.outputs.value }}.zip
          if-no-files-found: error

  wordpress-72:
    name: WordPress 7.2 RC3 / PHP 8.6
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.6'
          extensions: dom, libxml, mysqli, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Install pinned WordPress release candidate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://wordpress.org/wordpress-7.2-RC3.zip -o /tmp/wordpress-72.zip
          echo "59262c84d871e2cfbad5efd637a09ee5fdf8731e9764324f5df70d26a607fb40  /tmp/wordpress-72.zip" | sha256sum -c -
          unzip -q /tmp/wordpress-72.zip -d /tmp
          echo "WP_CORE_DIR=/tmp/wordpress" >> "$GITHUB_ENV"
      - run: composer check
      - name: Install pinned WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wp-cli-bin"
          curl --fail --silent --show-error --location https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o "$RUNNER_TEMP/wp-cli-bin/wp"
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $RUNNER_TEMP/wp-cli-bin/wp" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/wp-cli-bin/wp"
          echo "$RUNNER_TEMP/wp-cli-bin" >> "$GITHUB_PATH"
      - name: Set up an isolated WordPress site
        shell: bash
        run: |
          set -euo pipefail
          wp --path="$WP_CORE_DIR" config create --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          wp --path="$WP_CORE_DIR" core install --url=http://example.test --title='Compatibility smoke' --admin_user=smoke --admin_password=local-test-password --admin_email=smoke@example.test --skip-email
          ln -s "$GITHUB_WORKSPACE" "$WP_CORE_DIR/wp-content/plugins/aculect-icon-library"
          wp --path="$WP_CORE_DIR" plugin activate aculect-icon-library
          wp --path="$WP_CORE_DIR" option update icon_library_installed_collections '["heroicons"]' --format=json
          wp --path="$WP_CORE_DIR" option update icon_library_enabled_collections '["heroicons"]' --format=json
          wp --path="$WP_CORE_DIR" option update icon_library_enabled_variants '{"heroicons":["solid","outline"]}' --format=json
      - name: Verify save, reload, and rendered icons
        run: ICON_LIBRARY_WP_LOAD="$WP_CORE_DIR/wp-load.php" composer smoke
      - name: Verify Abilities REST contract
        run: ICON_LIBRARY_ALLOW_TEST_DATA=1 ICON_LIBRARY_WP_LOAD="$WP_CORE_DIR/wp-load.php" composer smoke:abilities

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, zip
          coverage: none
      - name: Read plugin version
        id: version
        shell: bash
        run: |
          version="$(awk -F': ' '/^[[:space:]]*\*[[:space:]]Version:/ { print $2; exit }' aculect-icon-library.php | tr -d '\r')"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: composer package
      - run: mkdir -p build/plugin-check && unzip -q build/aculect-icon-library.${{ steps.version.outputs.value }}.zip -d build/plugin-check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: .github/plugin-check/package-lock.json
      # The official action installs an unpinned wp-env globally. Keep the same
      # packaged-plugin scan, but use the committed runner to make CI reproducible.
      - run: npm ci --prefix .github/plugin-check --ignore-scripts
      - name: Run Plugin Check against the production ZIP
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir="$GITHUB_WORKSPACE/build/plugin-check/aculect-icon-library"
          plugin_slug="$(basename "$plugin_dir")"
          wp_env="$GITHUB_WORKSPACE/.github/plugin-check/node_modules/.bin/wp-env"
          wp_version="7.1.2"
          plugin_check_version="2.1.0"

          mkdir -p build/plugin-check-output
          cat > .wp-env.json <<EOF
          { "core": "WordPress/WordPress#$wp_version", "port": 8880, "testsPort": 8881, "mappings": { "wp-content/plugins/$plugin_slug": "$plugin_dir", "wp-content/plugin-check-output": "$GITHUB_WORKSPACE/build/plugin-check-output" } }
          EOF

          "$wp_env" start --update
          "$wp_env" run cli wp plugin install plugin-check --version="$plugin_check_version" --activate
          "$wp_env" run cli wp plugin activate "$plugin_slug"
          "$wp_env" run cli sh -c 'wp plugin check "$1" --format=strict-json --no-color --exclude-files=.wp-env.json --require=./wp-content/plugins/plugin-check/cli.php > /var/www/html/wp-content/plugin-check-output/report.txt' sh "$plugin_slug"
          php scripts/validate-plugin-check.php build/plugin-check-output/report.txt
